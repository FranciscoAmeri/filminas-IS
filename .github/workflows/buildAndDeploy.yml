name: Build and Deploy

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

# Permisos necesarios para publicar en Pages con el deploy nativo
permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicacion a la vez; no cancela una que ya este corriendo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure Pages 📄
        uses: actions/configure-pages@v5

      - name: Install and Build 🔧
        run: |
          npm ci || npm install
          npm run build
          cp slides/index.html public/index.html
          touch public/.nojekyll

      - name: Upload artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
